services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: stock-agent-frontend
    depends_on:
      web:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  web:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-web
    command: ["python", "main.py", "--node-type", "web"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: web
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
      MILVUS_URI: "${MILVUS_URI:-./data/milvus_lite.db}"
      STRATEGY_V2_MAX_CONCURRENT_RUNS: "${STRATEGY_V2_MAX_CONCURRENT_RUNS:-1}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  data-sync:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-data-sync
    command: ["python", "main.py", "--node-type", "data_sync"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: data_sync
      MILVUS_URI: "${MILVUS_URI:-./data/milvus_lite.db}"
      SYNC_PROFILE: "${SYNC_PROFILE:-conservative}"
      SYNC_RUN_INITIAL_SYNC: "${SYNC_RUN_INITIAL_SYNC:-false}"
      SYNC_MAX_RUNNING_JOBS: "${SYNC_MAX_RUNNING_JOBS:-1}"
      SYNC_MAX_PARALLEL_COLLECT_CONCURRENCY: "${SYNC_MAX_PARALLEL_COLLECT_CONCURRENCY:-2}"
      SYNC_JOB_TIMEOUT_SECONDS: "${SYNC_JOB_TIMEOUT_SECONDS:-1200}"
      SYNC_PREVENT_INITIAL_HISTORY_SYNC: "${SYNC_PREVENT_INITIAL_HISTORY_SYNC:-true}"
      SYNC_INITIAL_BACKFILL_DAYS: "${SYNC_INITIAL_BACKFILL_DAYS:-5}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${DATA_SYNC_CPUS:-0.75}"
          memory: "${DATA_SYNC_MEM_LIMIT:-512M}"
        reservations:
          memory: 256M

  listener:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-listener
    command: ["python", "main.py", "--node-type", "listener"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: listener
      MILVUS_URI: "${MILVUS_URI:-./data/milvus_lite.db}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  mongodb:
    image: "docker.m.daocloud.io/mongo:7.0"
    container_name: stock-agent-mongo
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1.0"]
    env_file:
      - .env.docker
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-change-me}"
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-stock_agent}"
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./AgentServer/deploy/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost", "--username", "${MONGO_INITDB_ROOT_USERNAME:-admin}", "--password", "${MONGO_INITDB_ROOT_PASSWORD:-change-me}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: "docker.m.daocloud.io/redis:7.2-alpine"
    container_name: stock-agent-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  mongo_data:
  redis_data:
  backend_logs:
  backend_data:

networks:
  stock-agent-network:
    driver: bridge
