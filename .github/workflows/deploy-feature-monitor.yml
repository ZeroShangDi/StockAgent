name: Deploy feature-monitor

on:
  push:
    branches:
      - feature-monitor
  workflow_dispatch:

concurrency:
  group: deploy-feature-monitor
  cancel-in-progress: true

jobs:
  deploy:
    # If Gitee mirrors to GitHub with a dedicated PAT user, set that GitHub username
    # in repository variable `GITEE_MIRROR_GITHUB_ACTOR` to skip duplicate deploy runs.
    if: github.event_name != 'push' || vars.GITEE_MIRROR_GITHUB_ACTOR == '' || github.actor != vars.GITEE_MIRROR_GITHUB_ACTOR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy to Aliyun over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          port: ${{ secrets.ALIYUN_PORT }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            export DEPLOY_BRANCH="feature-monitor"
            export DEPLOY_ROOT="${{ secrets.ALIYUN_DEPLOY_PATH }}"
            export DEPLOY_ENV_FILE=".env.docker"
            export DEPLOY_COMPOSE_FILES="docker-compose.yml"

            if [ -z "$DEPLOY_ROOT" ]; then
              echo "ALIYUN_DEPLOY_PATH is empty"
              exit 1
            fi

            cd "$DEPLOY_ROOT"
            git fetch origin "$DEPLOY_BRANCH"
            if git show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
              git checkout "$DEPLOY_BRANCH"
            else
              git checkout -b "$DEPLOY_BRANCH" --track "origin/$DEPLOY_BRANCH"
            fi
            git pull --ff-only origin "$DEPLOY_BRANCH"
            chmod +x tools/deploy/deploy_feature_monitor.sh
            ./tools/deploy/deploy_feature_monitor.sh
