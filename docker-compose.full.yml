services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: stock-agent-frontend
    depends_on:
      web:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  web:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-web
    command: ["python", "main.py", "--node-type", "web"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: web
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  data-sync:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-data-sync
    command: ["python", "main.py", "--node-type", "data_sync"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: data_sync
      MILVUS_URI: "${MILVUS_URI:-./data/milvus_lite.db}"
      SYNC_PROFILE: "${SYNC_PROFILE:-conservative}"
      SYNC_ENABLED_JOBS: "${SYNC_ENABLED_JOBS:-}"
      SYNC_DISABLED_JOBS: "${SYNC_DISABLED_JOBS:-}"
      SYNC_RUN_INITIAL_SYNC: "${SYNC_RUN_INITIAL_SYNC:-false}"
      SYNC_MAX_RUNNING_JOBS: "${SYNC_MAX_RUNNING_JOBS:-1}"
      SYNC_MAX_PARALLEL_COLLECT_CONCURRENCY: "${SYNC_MAX_PARALLEL_COLLECT_CONCURRENCY:-2}"
      SYNC_JOB_TIMEOUT_SECONDS: "${SYNC_JOB_TIMEOUT_SECONDS:-1200}"
      SYNC_LOCK_TIMEOUT_SECONDS: "${SYNC_LOCK_TIMEOUT_SECONDS:-1200}"
      SYNC_SCHEDULER_MISFIRE_GRACE_SECONDS: "${SYNC_SCHEDULER_MISFIRE_GRACE_SECONDS:-300}"
      SYNC_PREVENT_INITIAL_HISTORY_SYNC: "${SYNC_PREVENT_INITIAL_HISTORY_SYNC:-true}"
      SYNC_INITIAL_BACKFILL_DAYS: "${SYNC_INITIAL_BACKFILL_DAYS:-5}"
      SYNC_BACKFILL_WINDOW_START: "${SYNC_BACKFILL_WINDOW_START:-${DATASYNC_BACKFILL_WINDOW_START:-00:00}}"
      SYNC_BACKFILL_WINDOW_END: "${SYNC_BACKFILL_WINDOW_END:-${DATASYNC_BACKFILL_WINDOW_END:-08:00}}"
      SYNC_BACKFILL_QUEUE_SCHEDULE: "${SYNC_BACKFILL_QUEUE_SCHEDULE:-*/30 * * * *}"
      SYNC_BACKFILL_JOBS_PER_ROUND: "${SYNC_BACKFILL_JOBS_PER_ROUND:-2}"
      SYNC_BACKFILL_MAX_ATTEMPTS: "${SYNC_BACKFILL_MAX_ATTEMPTS:-3}"
      SYNC_BACKFILL_MAX_JOBS_PER_NIGHT: "${SYNC_BACKFILL_MAX_JOBS_PER_NIGHT:-24}"
      SYNC_BACKFILL_MAX_EXTERNAL_REQUESTS_PER_NIGHT: "${SYNC_BACKFILL_MAX_EXTERNAL_REQUESTS_PER_NIGHT:-300}"
      SYNC_BACKFILL_CONSECUTIVE_FAILURE_LIMIT: "${SYNC_BACKFILL_CONSECUTIVE_FAILURE_LIMIT:-3}"
      SYNC_CORE_GAP_RECOVERY_SCHEDULE: "${SYNC_CORE_GAP_RECOVERY_SCHEDULE:-}"
      SYNC_RECENT_CORE_GAP_RECOVERY_DAYS: "${SYNC_RECENT_CORE_GAP_RECOVERY_DAYS:-3}"
      SYNC_RUN_CORE_GAP_RECOVERY_ON_STARTUP: "${SYNC_RUN_CORE_GAP_RECOVERY_ON_STARTUP:-true}"
      SYNC_CORE_READY_CHECK_AFTER_LOCAL_TIME: "${SYNC_CORE_READY_CHECK_AFTER_LOCAL_TIME:-15:30}"
      SYNC_CORE_READY_EXPECTED_AFTER_LOCAL_TIME: "${SYNC_CORE_READY_EXPECTED_AFTER_LOCAL_TIME:-16:10}"
      SYNC_CORE_READY_FAIL_AFTER_LOCAL_TIME: "${SYNC_CORE_READY_FAIL_AFTER_LOCAL_TIME:-17:00}"
      SYNC_CORE_READY_AFTER_LOCAL_TIME: "${SYNC_CORE_READY_AFTER_LOCAL_TIME:-16:10}"
      SYNC_REVIEW_DATA_MAX_ROWS_PER_COLLECTION: "${SYNC_REVIEW_DATA_MAX_ROWS_PER_COLLECTION:-10000}"
      SYNC_MARKET_STATISTICS_CACHE_PERIODS: "${SYNC_MARKET_STATISTICS_CACHE_PERIODS:-1w,1m,3m}"
      SYNC_MARKET_WEATHER_MAX_CONCURRENT: "${SYNC_MARKET_WEATHER_MAX_CONCURRENT:-2}"
      SYNC_HOT_NEWS_ENABLED: "${SYNC_HOT_NEWS_ENABLED:-false}"
      SYNC_HOT_NEWS_SOURCE_ALLOWLIST: "${SYNC_HOT_NEWS_SOURCE_ALLOWLIST:-cls,xueqiu,wallstreetcn}"
      SYNC_HOT_NEWS_MAX_SOURCES_PER_ROUND: "${SYNC_HOT_NEWS_MAX_SOURCES_PER_ROUND:-3}"
      SYNC_HOT_NEWS_MAX_ITEMS_PER_SOURCE: "${SYNC_HOT_NEWS_MAX_ITEMS_PER_SOURCE:-20}"
      SYNC_HOT_NEWS_MAX_CONCURRENCY: "${SYNC_HOT_NEWS_MAX_CONCURRENCY:-3}"
      SYNC_HOT_NEWS_HTTP_TIMEOUT_SECONDS: "${SYNC_HOT_NEWS_HTTP_TIMEOUT_SECONDS:-10}"
      SYNC_HOT_NEWS_TOTAL_TIMEOUT_SECONDS: "${SYNC_HOT_NEWS_TOTAL_TIMEOUT_SECONDS:-30}"
      SYNC_MULTI_SOURCE_NEWS_MAX_CONCURRENCY: "${SYNC_MULTI_SOURCE_NEWS_MAX_CONCURRENCY:-2}"
      SYNC_MULTI_SOURCE_NEWS_LIMIT_PER_SOURCE: "${SYNC_MULTI_SOURCE_NEWS_LIMIT_PER_SOURCE:-50}"
      SYNC_EVENT_CLUSTERING_BATCH_SIZE: "${SYNC_EVENT_CLUSTERING_BATCH_SIZE:-30}"
      SYNC_EVENT_CLUSTERING_MAX_CONCURRENT: "${SYNC_EVENT_CLUSTERING_MAX_CONCURRENT:-3}"
      SYNC_SOURCE_CHAIN_OVERRIDES: "${SYNC_SOURCE_CHAIN_OVERRIDES:-}"
      SYNC_DEAD_LETTER_MAX_RECORDS_PER_BATCH: "${SYNC_DEAD_LETTER_MAX_RECORDS_PER_BATCH:-20}"
      SYNC_BULK_UPSERT_BATCH_SIZE: "${SYNC_BULK_UPSERT_BATCH_SIZE:-1000}"
      COZE_MAX_RETRIES: "${COZE_MAX_RETRIES:-2}"
      COZE_RETRY_BACKOFF_SECONDS: "${COZE_RETRY_BACKOFF_SECONDS:-0.5}"
      COZE_RETRY_BACKOFF_MAX_SECONDS: "${COZE_RETRY_BACKOFF_MAX_SECONDS:-5}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${DATA_SYNC_CPUS:-0.75}"
          memory: "${DATA_SYNC_MEM_LIMIT:-512M}"
        reservations:
          memory: 256M

  inference:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-inference
    command: ["python", "main.py", "--node-type", "inference"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: inference
      MAX_CONCURRENT_TASKS: "${MAX_CONCURRENT_TASKS:-5}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    volumes:
      - backend_logs:/app/logs
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  listener:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-listener
    command: ["python", "main.py", "--node-type", "listener"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: listener
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  backtest:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-backtest
    command: ["python", "main.py", "--node-type", "backtest"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: backtest
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  mcp:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: stock-agent-mcp
    command: ["python", "main.py", "--node-type", "mcp"]
    env_file:
      - .env.docker
    environment:
      NODE_TYPE: mcp
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    volumes:
      - backend_logs:/app/logs
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  mongodb:
    image: "docker.m.daocloud.io/mongo:7.0"
    container_name: stock-agent-mongo
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1.0"]
    env_file:
      - .env.docker
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-change-me}"
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-stock_agent}"
    ports:
      - "${MONGO_BIND_HOST:-127.0.0.1}:${MONGO_PUBLISHED_PORT:-${MONGO_PORT:-27017}}:27017"
    volumes:
      - mongo_data:/data/db
      - ./AgentServer/deploy/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost", "--username", "${MONGO_INITDB_ROOT_USERNAME:-admin}", "--password", "${MONGO_INITDB_ROOT_PASSWORD:-change-me}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: "docker.m.daocloud.io/redis:7.2-alpine"
    container_name: stock-agent-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PUBLISHED_PORT:-${REDIS_PORT:-6379}}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  etcd:
    image: "swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/coreos/etcd:v3.5.5-linuxarm64"
    container_name: stock-agent-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  minio:
    image: "docker.m.daocloud.io/minio/minio:RELEASE.2024-01-16T16-07-38Z"
    container_name: stock-agent-minio
    env_file:
      - .env.docker
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin123}"
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  milvus:
    image: "docker.m.daocloud.io/milvusdb/milvus:v2.4.0"
    container_name: stock-agent-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 8
      start_period: 90s
    networks:
      - stock-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  mongo_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  backend_logs:

networks:
  stock-agent-network:
    driver: bridge
